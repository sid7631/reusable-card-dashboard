# Development infrastructure only (npm run infra / infra:bigquery). To run the whole app in
# containers, use the compose.yaml at the repository root.
name: spendboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Local stand-in for BigQuery (development and tests only): npm run infra:bigquery
  bigquery:
    profiles: [bigquery]
    image: ghcr.io/goccy/bigquery-emulator:latest
    command: ["--project=spendboard-demo", "--dataset=analytics"]
    ports: ["${BIGQUERY_PORT:-9050}:9050"]

volumes:
  pgdata:
